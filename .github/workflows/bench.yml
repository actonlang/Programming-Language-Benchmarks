name: bench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    # Only main may use the dedicated runner; PRs use hosted runners.
    runs-on: ${{ fromJSON(github.ref == 'refs/heads/main' && vars.BENCHMARK_RUNNER || '["ubuntu-24.04"]') }}
    timeout-minutes: 90
    env:
      PYTHONINTMAXSTRDIGITS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libomp-dev libgmp-dev pkg-config python3-pip
      - name: Install Acton
        run: bash .github/acton.sh
      - name: Check measurement failure handling
        run: python3 bench/tests/test_measurements.py
      - name: Record machine and compiler versions
        run: |
          mkdir -p bench/build
          {
            date --utc --iso-8601=seconds
            uname -a
            lscpu
            acton version
            clang --version
            rustc --version
            cargo --version
            go version
            python3 --version
            dotnet --info
          } > bench/build/environment.txt
      - name: Build and check benchmark programs
        if: github.event_name == 'pull_request'
        run: bash .github/bench.sh
      - name: Build, check, and measure benchmark programs
        if: github.event_name != 'pull_request'
        run: bash .github/bench.sh measure
      - name: Preserve results
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench/build/_results/
            bench/build/environment.txt
          if-no-files-found: error
          retention-days: 90

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: bench
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
    with:
      publish: true
